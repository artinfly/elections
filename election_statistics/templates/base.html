{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Выборы{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        </div>
        <div class="sidebar-logo-text">Выборы<span>учёт голосования</span></div>
    </div>

    <div class="nav-section">Учёт</div>
    <a class="nav-link {% if request.resolver_match.url_name == 'method' %}active{% endif %}" href="{% url 'method' %}">Способ голосования</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'elections' %}active{% endif %}" href="{% url 'elections' %}">Голосование</a>

    <div class="nav-section">Данные</div>
    {% if is_operator %}
    <a class="nav-link {% if request.resolver_match.url_name == 'upload' %}active{% endif %}" href="{% url 'upload' %}">Загрузка</a>
    {% endif %}
    <a class="nav-link {% if request.resolver_match.url_name == 'export' %}active{% endif %}" href="{% url 'export' %}">Отчёты</a>

    <div class="sidebar-logout">
        <a href="{% url 'logout' %}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            Выйти
        </a>
    </div>
</div>

<div class="main-content">
<form id="csrf-holder" hidden>{% csrf_token %}</form>
<div class="err-msg" id="app-error" style="display:none"></div>
{% block content %}{% endblock %}
</div>
<div class="modal-back" id="uik-modal" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <div>
                <div class="modal-title">Люди по участкам</div>
                <div class="modal-sub" id="uik-modal-sub"></div>
            </div>
            <button type="button" class="modal-close" id="uik-modal-close">&times;</button>
        </div>
        <div class="modal-body" id="uik-modal-body"></div>
    </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
